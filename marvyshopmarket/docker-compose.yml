# stack dev con hot-reload completo
# ┌─ marvyshopmarket/
# │  ├─ backend/
# │  └─ frontend/
# └─ docker-compose.yml

services:
  # ──────────────── MYSQL ────────────────
  mysql:
    image: mysql:8.4
    container_name: marvyshop-mysql
    environment:
      MYSQL_DATABASE: marvyshopmarket
      MYSQL_USER: marvy
      MYSQL_PASSWORD: marvy_dev_password
      MYSQL_ROOT_PASSWORD: marvy_root_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmarvy_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ──────────────── BACKEND ────────────────
  backend:
    build: ./backend
    container_name: marvyshop-backend
    env_file: ./backend/.env
    environment:
      SECRET_KEY: dev-secret-key-change-me
      SQLALCHEMY_DATABASE_URI: mysql+mysqldb://marvy:marvy_dev_password@mysql:3306/marvyshopmarket?charset=utf8mb4
    command: gunicorn -w 4 -b 0.0.0.0:5000 "app:create_app()"
    volumes:
      - ./backend/app:/app/app
      - ./backend/uploads:/app/uploads
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

  # ──────────────── FRONTEND ───────────────
  frontend:
    build: ./frontend
    container_name: marvyshop-frontend
    command: npm run dev -- --host
    environment:
      VITE_API_URL: /api
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    volumes:
      - ./frontend/app:/app
      - /app/node_modules         # volumen anónimo para conservar dependencias
    ports:
      - "5174:5174"
    depends_on:
      - backend

volumes:
  mysql_data:
