# stack dev con hot-reload completo
# ┌─ marvyshopmarket/
# │  ├─ backend/
# │  └─ frontend/
# └─ docker-compose.yml

services:
  # ──────────────── BACKEND ────────────────
  backend:
    build: ./backend
    container_name: marvyshop-backend
    env_file: ./backend/.env
    command: gunicorn -w 4 -b 0.0.0.0:5000 "app:create_app()"
    volumes:
      - ./backend/app:/app/app
      - ./backend/uploads:/app/uploads
    ports:
      - "5000:5000"
    restart: on-failure

  # ──────────────── FRONTEND ───────────────
  frontend:
    build: ./frontend
    container_name: marvyshop-frontend
    command: npm run dev -- --host
    environment:
      VITE_API_URL: http://localhost:5000/api   # 👈 mapping, no guiones
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    volumes:
      - ./frontend/app:/app
      - /app/node_modules         # volumen anónimo para conservar dependencias
    ports:
      - "5174:5174"
    depends_on:
      - backend
